<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LLM Robotics Article Data Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .menu {
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
    }
    .video-container {
      flex: 1;
    }
    video {
      width: 100%;
      max-width: 100%;
      border: 1px solid #ccc;
    }
    details {
      margin-top: 10px;
      background: #f9f9f9;
      padding: 5px;
      border: 1px solid #ddd;
    }
    details summary {
      cursor: pointer;
      font-weight: bold;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: none;
    }
    button {
      margin-left: 10px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>LLM Robotics Article Data Explorer</h1>
  
  <div class="menu">
    <label for="envSelect">Select Environment: </label>
    <select id="envSelect">
      <option value="acrobot">Acrobot</option>
      <option value="cart_pole">Cart Pole</option>
      <option value="inverted_pendulum">Inverted Pendulum</option>
      <option value="mt_car_continuous">Mountain Car Continuous</option>
      <option value="mt_car_discrete">Mountain Car Discrete</option>
      <option value="pendulum">Pendulum</option>
    </select>
    &nbsp;&nbsp;
    <label for="seedSelect">Select Seed: </label>
    <select id="seedSelect">
      <option value="best">Best</option>
      <option value="worst">Worst</option>
    </select>
    &nbsp;&nbsp;
    <!-- Extra menus for cart_pole only -->
    <span id="versionContainer" style="display:none;">
      <label for="versionSelect">Select Experiment Version: </label>
      <select id="versionSelect">
        <option value="action_space_modified">Action Space Modified</option>
        <option value="observation_action_spaces_modified">Observation Action Space Modified</option>
      </select>
    </span>
    &nbsp;&nbsp;
    <span id="modelContainer" style="display:none;">
      <label for="modelSelect">Select Model: </label>
      <select id="modelSelect">
        <option value="deepseek">deepseek</option>
        <option value="llama">llama</option>
        <option value="mistral">mistral</option>
        <option value="qwen">qwen</option>
      </select>
    </span>
    &nbsp;&nbsp;
    <button id="viewLogBtn">View Log</button>
    <button id="playBothBtn">Play Both Videos</button>
  </div>
  
  <div class="container">
    <!-- Initial Strategy Column -->
    <div class="video-container">
      <h2>Initial Strategy</h2>
      <video id="initialVideo" controls>
        Your browser does not support the video tag.
      </video>
      <details>
        <summary>Show Python Code</summary>
        <iframe id="initialCodeFrame" src=""></iframe>
      </details>
      <details>
        <summary>Show Rules</summary>
        <iframe id="initialRulesFrame" src=""></iframe>
      </details>
    </div>
    
    <!-- Final (Best) Strategy Column -->
    <div class="video-container">
      <h2>
        Best Strategy 
        <!-- Toggle for pendulum -->
        <button id="toggleFinalBtn" style="display:none;">Watch Another Trial</button>
        <!-- Extra toggle for Cart Pole special case -->
        <button id="toggleCartPoleFinalBtn" style="display:none;">Toggle to Fail</button>
      </h2>
      <video id="finalVideo" controls>
        Your browser does not support the video tag.
      </video>
      <details>
        <summary>Show Python Code</summary>
        <iframe id="finalCodeFrame" src=""></iframe>
      </details>
      <details>
        <summary>Show Rules</summary>
        <iframe id="finalRulesFrame" src=""></iframe>
      </details>
    </div>
  </div>
  
  <script>
    // Global toggle variables.
    let finalVideoMode = "original";    // For pendulum.
    let cartPoleFinalMode = "success";    // For Cart Pole special case.
    
    // Updates file paths for videos and policies based on current selections.
    function updateContent() {
      const env = document.getElementById('envSelect').value;
      const seed = document.getElementById('seedSelect').value;
      
      let basePath = env;
      
      // For Cart Pole, include version and model.
      if (env === "cart_pole") {
        document.getElementById('versionContainer').style.display = "inline-block";
        document.getElementById('modelContainer').style.display = "inline-block";
        const version = document.getElementById('versionSelect').value;
        const model = document.getElementById('modelSelect').value;
        basePath = `${env}/${version}/${model}`;
      } else {
        document.getElementById('versionContainer').style.display = "none";
        document.getElementById('modelContainer').style.display = "none";
      }
      
      // Update initial video.
      const initialVideoPath = `${basePath}/videos/${seed}_seed_best_initial.mp4`;
      document.getElementById('initialVideo').src = initialVideoPath;
      
      // Determine final video path.
      let finalVideoPath = "";
      
      if (env === "pendulum") {
        // Pendulum: toggle between original and same_strategy.
        document.getElementById('toggleFinalBtn').style.display = "inline-block";
        document.getElementById('toggleCartPoleFinalBtn').style.display = "none";
        finalVideoPath = (finalVideoMode === "original") ?
            `${env}/videos/${seed}_seed_best_final.mp4` :
            `${env}/videos/${seed}_seed_best_final_same_strategy.mp4`;
      } else if (env === "cart_pole") {
        // Cart Pole special case.
        const version = document.getElementById('versionSelect').value;
        const model = document.getElementById('modelSelect').value;
        if (seed === "worst" && ((version === "action_space_modified" && model === "deepseek") || (version === "observation_action_spaces_modified" && (model==="deepseek" || model==="llama")))) {
          // Show extra Cart Pole toggle button.
          document.getElementById('toggleCartPoleFinalBtn').style.display = "inline-block";
          finalVideoPath = (cartPoleFinalMode === "success") ?
              `${basePath}/videos/${seed}_seed_best_final_success.mp4` :
              `${basePath}/videos/${seed}_seed_best_final_fail.mp4`;
          document.getElementById('toggleFinalBtn').style.display = "none";
        } else {
          document.getElementById('toggleCartPoleFinalBtn').style.display = "none";
          finalVideoPath = `${basePath}/videos/${seed}_seed_best_final.mp4`;
        }
        // Reset pendulum toggle when switching away.
        finalVideoMode = "original";
      } else {
        // Other environments.
        document.getElementById('toggleFinalBtn').style.display = "none";
        document.getElementById('toggleCartPoleFinalBtn').style.display = "none";
        finalVideoPath = `${basePath}/videos/${seed}_seed_best_final.mp4`;
        finalVideoMode = "original";
        cartPoleFinalMode = "success";
      }
      
      document.getElementById('finalVideo').src = finalVideoPath;
      
      // Update policy file paths.
      const codePath_best = `${basePath}/policies/${seed}_seed_final_code.txt`;
      const rulesPath_best = `${basePath}/policies/${seed}_seed_final_rules.txt`;
      const codePath_initial = `${basePath}/policies/${seed}_seed_initial_code.txt`;
      const rulesPath_initial = `${basePath}/policies/${seed}_seed_initial_rules.txt`;
      
      document.getElementById('initialCodeFrame').src = codePath_initial;
      document.getElementById('finalCodeFrame').src = codePath_best;
      document.getElementById('initialRulesFrame').src = rulesPath_initial;
      document.getElementById('finalRulesFrame').src = rulesPath_best;
    }
    
    // Toggle for pendulum final video mode.
    document.getElementById('toggleFinalBtn').addEventListener('click', function() {
      finalVideoMode = (finalVideoMode === "original") ? "same_strategy" : "original";
      const env = document.getElementById('envSelect').value;
      const seed = document.getElementById('seedSelect').value;
      let finalVideoPath = "";
      if (finalVideoMode === "original") {
        finalVideoPath = `${env}/videos/${seed}_seed_best_final.mp4`;
        this.textContent = "Watch Another Trial";
      } else {
        finalVideoPath = `${env}/videos/${seed}_seed_best_final_same_strategy.mp4`;
        this.textContent = "Watch Best Trial";
      }
      document.getElementById('finalVideo').src = finalVideoPath;
    });
    
    // Toggle for Cart Pole special case.
    document.getElementById('toggleCartPoleFinalBtn').addEventListener('click', function() {
      cartPoleFinalMode = (cartPoleFinalMode === "success") ? "fail" : "success";
      const env = document.getElementById('envSelect').value;
      const seed = document.getElementById('seedSelect').value;
      const version = document.getElementById('versionSelect').value;
      const model = document.getElementById('modelSelect').value;
      const basePath = `${env}/${version}/${model}`;
      let finalVideoPath = (cartPoleFinalMode === "success") ?
          `${basePath}/videos/${seed}_seed_best_final_success.mp4` :
          `${basePath}/videos/${seed}_seed_best_final_fail.mp4`;
      document.getElementById('finalVideo').src = finalVideoPath;
      this.textContent = (cartPoleFinalMode === "success") ? "Toggle to Fail" : "Toggle to Success";
    });
    
    // Event listeners for dropdown changes.
    document.getElementById('envSelect').addEventListener('change', updateContent);
    document.getElementById('seedSelect').addEventListener('change', updateContent);
    document.getElementById('versionSelect').addEventListener('change', updateContent);
    document.getElementById('modelSelect').addEventListener('change', updateContent);
    
    // Button to view the log file in a new window.
    document.getElementById('viewLogBtn').addEventListener('click', function() {
      let env = document.getElementById('envSelect').value;
      let seed = document.getElementById('seedSelect').value;
      let basePath = env;
      if (env === "cart_pole") {
        const version = document.getElementById('versionSelect').value;
        const model = document.getElementById('modelSelect').value;
        basePath = `${env}/${version}/${model}`;
      }
      const logPath = `${basePath}/logs/${seed}_seed.log`;
      window.open(logPath, '_blank');
    });
    
    // Button to play both videos simultaneously.
    document.getElementById('playBothBtn').addEventListener('click', function() {
      document.getElementById('initialVideo').play();
      document.getElementById('finalVideo').play();
    });
    
    // Initialize the page.
    updateContent();
  </script>
</body>
</html>
