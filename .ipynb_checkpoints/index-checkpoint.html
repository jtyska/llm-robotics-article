<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LLM Robotics Article Data Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .menu {
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
    }
    .video-container {
      flex: 1;
    }
    video {
      width: 100%;
      max-width: 100%;
      border: 1px solid #ccc;
    }
    details {
      margin-top: 10px;
      background: #f9f9f9;
      padding: 5px;
      border: 1px solid #ddd;
    }
    details summary {
      cursor: pointer;
      font-weight: bold;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>LLM Robotics Article Viewer</h1>
  
  <div class="menu">
    <label for="envSelect">Select Environment: </label>
    <select id="envSelect">
      <option value="acrobot">Acrobot</option>
      <option value="cart_pole">Cart Pole</option>
      <option value="inverted_pendulum">Inverted Pendulum</option>
      <option value="mt_car_continuous">Mountain Car Continuous</option>
      <option value="mt_car_discrete">Mountain Car Discrete</option>
      <option value="pendulum">Pendulum</option>
    </select>
    &nbsp;&nbsp;
    <label for="seedSelect">Select Seed: </label>
    <select id="seedSelect">
      <option value="best">Best</option>
      <option value="worst">Worst</option>
    </select>
  </div>
  
  <div class="container">
    <!-- Initial Video Column -->
    <div class="video-container">
      <h2>Initial Video</h2>
      <video id="initialVideo" controls>
        Your browser does not support the video tag.
      </video>
      <details>
        <summary>Show Python Code</summary>
        <iframe id="initialCodeFrame" src=""></iframe>
      </details>
      <details>
        <summary>Show Rules</summary>
        <iframe id="initialRulesFrame" src=""></iframe>
      </details>
    </div>
    
    <!-- Final Video Column -->
    <div class="video-container">
      <h2>Final Video</h2>
      <video id="finalVideo" controls>
        Your browser does not support the video tag.
      </video>
      <details>
        <summary>Show Python Code</summary>
        <iframe id="finalCodeFrame" src=""></iframe>
      </details>
      <details>
        <summary>Show Rules</summary>
        <iframe id="finalRulesFrame" src=""></iframe>
      </details>
    </div>
  </div>
  
  <script>
    // Updates video sources and policy file links based on the selected environment and seed.
    function updateContent() {
      alert('HI')
      var env = document.getElementById('envSelect').value;
      var seed = document.getElementById('seedSelect').value;
      
      // Construct file paths.
      // Videos: the filenames follow the pattern "seed_seed_best_initial.mp4" and "seed_seed_best_final_t14.mp4"
      var initialVideoPath = env + "/videos/" + seed + "_seed_best_initial.mp4";
      var finalVideoPath = env + "/videos/" + seed + "_seed_best_final_t14.mp4";
      
      // Policies: the filenames are "seed_seed_final_code.py" and "seed_seed_final_rules.py"
      var codePath = env + "/policies/" + seed + "_seed_final_code.py";
      var rulesPath = env + "/policies/" + seed + "_seed_final_rules.py";
      
      // Update video elements.
      document.getElementById('initialVideo').src = initialVideoPath;
      document.getElementById('finalVideo').src = finalVideoPath;
      
      // Update iframes in the details elements.
      document.getElementById('initialCodeFrame').src = codePath;
      document.getElementById('finalCodeFrame').src = codePath;
      document.getElementById('initialRulesFrame').src = rulesPath;
      document.getElementById('finalRulesFrame').src = rulesPath;
    }
    
    // Listen to changes in the drop-down menus.
    document.getElementById('envSelect').addEventListener('change', updateContent);
    document.getElementById('seedSelect').addEventListener('change', updateContent);
    
    // Initialize the page content.
    updateContent();
  </script>
</body>
</html>
